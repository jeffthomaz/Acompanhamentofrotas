*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--text);font-size:15px;line-height:1.55;
  padding-bottom:3rem}

.wrap{max-width:1104px;margin:0 auto;display:grid;gap:1.75rem;padding-top:1.75rem}

.wrap>*{min-width:0}

[role=tablist]{display:flex;flex-wrap:wrap;gap:.5rem;min-width:0;max-width:100%}

.seg{display:flex;gap:.25rem}

button:focus-visible{outline:3px solid var(--maq);outline-offset:2px}

.head{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:1.5rem 3rem;align-items:end}
.lead{font-family:var(--display);font-weight:600;font-size:clamp(1.35rem,3vw,2rem);line-height:1.2;letter-spacing:-.015em;margin:0;text-wrap:pretty}

.legend i{display:inline-block;width:.7rem;height:.7rem;border-radius:2px;margin-right:.35rem;vertical-align:-1px}
.board{border-top:2px solid var(--ink)}
.row{display:grid;grid-template-columns:minmax(7rem,11rem) minmax(0,1fr) 8.5rem;gap:0 1rem;align-items:stretch;border-bottom:1px solid var(--line);min-height:3.4rem}

.plot{position:relative;display:flex;align-items:center}
.bar{display:flex;height:1.15rem;border-radius:3px;overflow:hidden;transform-origin:left;animation:grow .8s cubic-bezier(.2,.8,.2,1) backwards;animation-delay:calc(var(--i,0)*45ms);min-width:2px}
.bar span{display:flex;align-items:center;justify-content:center;font-size:.7rem;font-weight:600;color:var(--bg);min-width:0;overflow:hidden}
.bar span.s1{color:var(--bg)}.bar span.s2{color:var(--maq-ink)}.bar span.s3{color:var(--on3)}.bar span.s4{color:var(--on4)}
.s1{background:var(--s1)}.s2{background:var(--s2)}.s3{background:var(--s3)}.s4{background:var(--s4)}
.bar.solo{background:var(--folha)}.bar.over{background:var(--critico)}
.mk{position:absolute;top:0;bottom:0;width:2px;background:var(--ink);opacity:.85}
.mkl{position:absolute;bottom:0;transform:translateX(-50%);white-space:nowrap;font-weight:600;color:var(--ink)}
.res{display:grid;align-content:center;justify-items:end;text-align:right;line-height:1.2}
.res strong{font-family:var(--display);font-weight:800;font-size:1.45rem;letter-spacing:-.02em;font-variant-numeric:tabular-nums}

.n-bom{color:var(--bom)}.n-atencao{color:var(--atencao)}.n-critico{color:var(--critico)}

.filtros label{display:grid;gap:.25rem;font-size:.8rem;font-weight:600;color:var(--muted)}
.filtros select{font:inherit;font-size:.92rem;font-weight:500;color:var(--ink);background:var(--bg);border:1px solid var(--ink);border-radius:6px;padding:.45rem 2rem .45rem .7rem;min-width:min(100%,15rem);max-width:100%}
.limpar{font:inherit;font-size:.85rem;font-weight:600;color:var(--ink);background:none;border:0;border-bottom:2px solid var(--maq);padding:.2rem 0;cursor:pointer}
select:focus-visible{outline:3px solid var(--maq);outline-offset:2px}
.bar span.v1,.bar.v1{background:var(--v1)}.bar span.v2,.bar.v2{background:var(--v2)}.bar span.v3,.bar.v3{background:var(--v3)}
.row.subrow{min-height:2.5rem;border-bottom:1px dashed var(--line)}
.row.subrow .who{padding-left:1rem}.row.subrow .who b{font-size:.88rem;font-weight:600}.row.subrow .bar{height:.8rem}.row.subrow .res strong{font-size:1.05rem}
.rowbtn{font:inherit;color:inherit;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);width:100%;padding:0;cursor:pointer}
.rowbtn:hover{background:var(--soft)}.rowbtn:focus-visible{outline:3px solid var(--maq);outline-offset:-3px}
.ctx{margin:0;margin-left:auto;font-size:.8rem;color:var(--muted)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(9.2rem,1fr));gap:.75rem}
.kpi{position:relative;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:.9rem .8rem 1.15rem;display:grid;gap:.2rem;justify-items:center;text-align:center;box-shadow:0 1px 4px rgba(10,42,25,.1);overflow:hidden}
.kpi::after{content:"";position:absolute;left:0;right:0;bottom:0;height:6px;background:var(--cc)}
@media (min-width:1000px){.kpis{grid-template-columns:repeat(7,minmax(0,1fr))}.kpis{gap:.55rem}.kpi{padding-inline:.5rem}.kpi .ic{width:1.45rem;height:1.45rem}.kh{gap:.35rem}.kl{font-size:.74rem;letter-spacing:-.01em}.kv{font-size:clamp(1.5rem,2.1vw,2rem)}}
.kl{min-width:0}

.kpi .ic{width:2.1rem;height:2.1rem;flex:none;color:var(--cc);stroke-width:1.6}
.kl{font-size:.82rem;font-weight:700;line-height:1.2}
.kv{font-family:var(--display);font-weight:800;font-size:2.4rem;line-height:1.1;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.dl{font-size:.9rem;font-weight:700;font-variant-numeric:tabular-nums}.dl.bom{color:var(--bom)}.dl.ruim{color:var(--critico)}.dl.neutro{color:var(--muted)}
.ks{font-size:.72rem;color:var(--muted)}
.kp{display:grid;justify-items:center;gap:0;font-size:.76rem;color:var(--muted);margin:-.1rem 0 .1rem}.kp b{color:var(--ink);font-variant-numeric:tabular-nums}.kp i{font-style:normal;opacity:.6}
.c-total{--cc:var(--c-total)}.c-vel{--cc:var(--c-vel)}.c-celular{--cc:var(--c-celular)}.c-cinto{--cc:var(--c-cinto)}.c-distracao{--cc:var(--c-distracao)}.c-cigarro{--cc:var(--c-cigarro)}.c-faixa{--cc:var(--c-faixa)}.c-fadiga{--cc:var(--c-cigarro)}.c-camera{--cc:var(--c-faixa)}.c-outros{--cc:var(--c-outros)}
.g3{display:grid;gap:1rem}
.g-a{grid-template-columns:minmax(0,1.55fr) minmax(0,1.1fr) minmax(0,1fr)}
.g-b{grid-template-columns:repeat(3,minmax(0,1fr))}
@media (max-width:980px){.g-a,.g-b{grid-template-columns:minmax(0,1fr)}}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:1rem 1.1rem 1.1rem;box-shadow:0 1px 3px rgba(10,42,25,.08);min-width:0}
.card h3{font-family:var(--display);font-weight:700;font-size:1.02rem;margin:0 0 .6rem}
.cs{margin:-.35rem 0 .7rem;font-size:.8rem;color:var(--muted)}
.card .legend{margin:0 0 .4rem;gap:.2rem .8rem;font-size:.74rem}
.chart.big{max-height:320px}
.card .dia h3{font-size:.8rem;font-weight:500;color:var(--muted);margin:-.35rem 0 .5rem}
rect.seg.c-total{fill:var(--folha)}
.grade{stroke:var(--line);stroke-width:1}
.seg{stroke:var(--card);stroke-width:1;transform-box:fill-box;transform-origin:bottom;animation:up .7s cubic-bezier(.2,.8,.2,1) backwards}
rect.seg.c-vel{fill:var(--c-vel)}rect.seg.c-celular{fill:var(--c-celular)}rect.seg.c-cinto{fill:var(--c-cinto)}rect.seg.c-distracao{fill:var(--c-distracao)}rect.seg.c-cigarro{fill:var(--c-cigarro)}rect.seg.c-faixa{fill:var(--c-faixa)}rect.seg.c-fadiga{fill:var(--c-cigarro)}rect.seg.c-camera{fill:var(--c-faixa)}rect.seg.c-outros{fill:var(--c-outros)}
.legend i{background:var(--cc)}
.rosca-w{display:grid;gap:1rem;justify-items:center}
.rosca{width:min(100%,13rem);height:auto}
.arco{fill:none;stroke:var(--cc)}
.rc-n{font-family:var(--display);font-weight:800;font-size:7px;fill:var(--ink)}.rc-t{font-size:3.2px;fill:var(--muted)}

.li .t{font-weight:600;font-size:.88rem;min-width:0;overflow-wrap:anywhere}.li .t small,.li .n small{display:block;font-weight:400;font-size:.72rem;color:var(--muted)}
.li .n{font-family:var(--display);font-weight:700;font-size:1.05rem;text-align:right;font-variant-numeric:tabular-nums}
.bb{grid-column:1/-1;height:.55rem;background:var(--soft);border-radius:3px;overflow:hidden}
.ff{height:100%;background:var(--folha);border-radius:3px;transform-origin:left;animation:grow .8s cubic-bezier(.2,.8,.2,1) backwards;animation-delay:calc(var(--i,0)*45ms)}
.ff.v1{background:var(--v1)}.ff.v2{background:var(--v2)}.ff.v3{background:var(--v3)}
.lib{cursor:pointer}.lib:hover{background:var(--soft)}.lib:focus-visible{outline:3px solid var(--maq);outline-offset:-3px}

.alertas li:last-child{border-bottom:0}

.chart{width:100%;height:auto;max-height:150px;display:block}

.scroll{overflow-x:auto}
.tb{width:100%;border-collapse:collapse;min-width:560px;font-variant-numeric:tabular-nums}
.tb th,.tb td{padding:.6rem .6rem .6rem 0;text-align:left;border-bottom:1px solid var(--line);font-size:.9rem}

.rodape{margin:0;font-size:.8rem;color:var(--muted);max-width:75ch}

.longas li{display:flex;justify-content:space-between;gap:.8rem;padding:.5rem 0;border-bottom:1px solid var(--line);font-size:.86rem}
.longas li:last-child{border-bottom:0}
.longas small{display:block;color:var(--muted);font-size:.74rem}
.longas strong{font-family:var(--display);white-space:nowrap;font-variant-numeric:tabular-nums}
.calor{pointer-events:none}
.leaflet-container{font-family:var(--text)}
.saudacao{margin:0;font-size:1.05rem;display:flex;flex-wrap:wrap;gap:.2rem .5rem;align-items:baseline}
.saudacao strong{font-family:var(--display);font-weight:800;font-size:1.45rem;letter-spacing:-.02em}
.saudacao span{color:var(--muted)}.saudacao b{color:var(--ink);font-weight:700}
.quem{margin-left:auto;display:flex;align-items:center;gap:.9rem;text-align:right}
.quem b{display:block;font-weight:600}.quem small{display:block;font-size:.8rem;color:#BFD3C6}
.quem button{font:inherit;font-size:.85rem;font-weight:600;color:#fff;background:transparent;border:1px solid rgba(255,255,255,.55);border-radius:6px;padding:.3rem .9rem;cursor:pointer}
.quem button:hover{background:rgba(255,255,255,.12)}
.acesso{display:grid;place-items:start center;padding-top:3rem;min-height:60vh}
.login{width:min(100%,24rem);background:var(--card);border:1px solid var(--line);border-top:6px solid var(--maq);border-radius:12px;padding:1.5rem 1.4rem;display:grid;gap:.9rem;box-shadow:0 2px 10px rgba(10,42,25,.12)}
.login h2{font-family:var(--display);font-weight:800;font-size:1.5rem;letter-spacing:-.02em;margin:0}
.login .sub{margin:-.5rem 0 .2rem;color:var(--muted);font-size:.88rem}
.login label{display:grid;gap:.3rem;font-size:.82rem;font-weight:600;color:var(--muted)}
.login input{font:inherit;font-size:1rem;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:.6rem .75rem}
.login input:focus-visible{outline:3px solid var(--maq);outline-offset:1px;border-color:var(--ink)}
.login button{font:inherit;font-weight:700;font-size:1rem;color:var(--maq-ink);background:var(--maq);border:0;border-radius:6px;padding:.7rem;cursor:pointer}
.login button:disabled{opacity:.6;cursor:progress}
.erro{margin:0;min-height:1.2em;color:var(--critico);font-size:.88rem;font-weight:600}
@media (max-width:560px){.quem{margin-left:0;width:100%;justify-content:space-between;text-align:left}}
@keyframes grow{from{transform:scaleX(0)}}@keyframes up{from{transform:scaleY(0)}}
@media (prefers-reduced-motion:reduce){.bar,.col{animation:none}}
@media (max-width:720px){.head{grid-template-columns:minmax(0,1fr)}}
@media (max-width:480px){.logo{height:68px}}
@media (max-width:560px){
  .row{grid-template-columns:1fr auto;gap:.25rem 1rem;padding-block:.6rem}
  .row .plot{grid-column:1/-1;order:3;min-height:1.6rem}
  .row.hd{display:none}
}
</style>
