<!doctype html>
<html lang="pt-BR"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Acompanhamento de frotas</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Public+Sans:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#EDF0EA;--ink:#16251E;--muted:#5A6A61;--line:#CBD3CB;--soft:#E2E7E0;
  --folha:#3E9B34;--maq:#E9A800;--maq-ink:#16251E;
  --v1:#E9A800;--v2:#E2701B;--v3:#C23B2B;
  --s1:#0F4A2A;--s2:#E9A800;--s3:#5E9C8A;--s4:#AEBBB2;--on3:#16251E;--on4:#16251E;
  --bom:#2C7A4B;--atencao:#8F6200;--critico:#C23B2B;
  --bom-bg:#D9ECDF;--atencao-bg:#F6E7B8;--critico-bg:#F6D9D4;
  --display:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;
  --text:'Public Sans','Segoe UI',system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0F1914;--ink:#E6EEE8;--muted:#9BAAA1;--line:#2A3A32;--soft:#1A2820;
  --folha:#6FBF99;--maq:#F2B90F;--maq-ink:#16251E;
  --v1:#F2B90F;--v2:#F08C3C;--v3:#F2807A;--s1:#6FBF99;--s2:#F2B90F;--s3:#3F8A78;--s4:#55655C;--on3:#FFFFFF;--on4:#FFFFFF;
  --bom:#6FD09A;--atencao:#F2C24D;--critico:#F2807A;
  --bom-bg:#173325;--atencao-bg:#3A2F10;--critico-bg:#3B1E1B;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1914;--ink:#E6EEE8;--muted:#9BAAA1;--line:#2A3A32;--soft:#1A2820;
  --folha:#6FBF99;--maq:#F2B90F;--maq-ink:#16251E;
  --v1:#F2B90F;--v2:#F08C3C;--v3:#F2807A;--s1:#6FBF99;--s2:#F2B90F;--s3:#3F8A78;--s4:#55655C;--on3:#FFFFFF;--on4:#FFFFFF;
  --bom:#6FD09A;--atencao:#F2C24D;--critico:#F2807A;
  --bom-bg:#173325;--atencao-bg:#3A2F10;--critico-bg:#3B1E1B;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--text);font-size:15px;line-height:1.55;
  padding-bottom:3rem}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.band{background:linear-gradient(90deg,#0A2A19 0%,rgba(10,42,25,.86) 42%,rgba(10,42,25,.5) 100%),url(fundo.jpg) right center/cover #0A2A19;color:#fff;border-bottom:4px solid var(--maq)}
.band-in{max-width:1104px;margin:0 auto;display:flex;flex-wrap:wrap;align-items:center;gap:1rem 1.75rem;padding-block:1.6rem}
.logo{display:block;height:92px;width:auto}
.band h1{color:#fff}
.band .per{color:#BFD3C6;margin:.5rem 0 0}
.wrap{max-width:1104px;margin:0 auto;display:grid;gap:1.75rem;padding-top:1.75rem}
.foot{max-width:1104px;margin:2.5rem auto 0;font-size:.82rem;color:var(--muted)}
.foot a{color:inherit}
.wrap>*{min-width:0}
h1{font-family:var(--display);font-weight:800;font-size:clamp(1.9rem,5vw,3rem);line-height:1;letter-spacing:-.03em;margin:0;text-wrap:balance}
.per{color:var(--muted);font-size:.9rem;margin:0}
.aviso{margin:0;padding:.5rem .8rem;border-left:4px solid var(--maq);background:var(--atencao-bg);color:var(--ink);font-size:.88rem}
.nav{display:flex;flex-wrap:wrap;gap:.5rem 1.5rem;justify-content:space-between;align-items:flex-end;border-bottom:1px solid var(--line)}
[role=tablist]{display:flex;gap:1.6rem;overflow-x:auto;min-width:0;max-width:100%}
@media (max-width:420px){[role=tablist]{gap:1.1rem}[role=tab]{font-size:1.05rem}}
[role=tab]{font-family:var(--display);font-weight:700;font-size:1.2rem;letter-spacing:-.01em;color:var(--muted);background:none;border:0;border-bottom:4px solid transparent;padding:.4rem 0 .55rem;margin-bottom:-1px;cursor:pointer;white-space:nowrap}
[role=tab]:hover{color:var(--ink)}
[role=tab][aria-selected=true]{color:var(--ink);border-bottom-color:var(--maq)}
.seg{display:flex;gap:.25rem;padding-bottom:.5rem}
.seg button{font:inherit;font-size:.85rem;font-weight:500;padding:.25rem .8rem;border:1px solid var(--line);border-radius:6px;background:transparent;color:var(--muted);cursor:pointer}
.seg button[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
button:focus-visible{outline:3px solid var(--maq);outline-offset:2px}
#painel{display:grid;gap:2.25rem;min-width:0}
#painel>*{min-width:0}
#painel:focus-visible{outline:none}
.head{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:1.5rem 3rem;align-items:end}
.lead{font-family:var(--display);font-weight:600;font-size:clamp(1.35rem,3vw,2rem);line-height:1.2;letter-spacing:-.015em;margin:0;text-wrap:pretty}
.lead b{font-weight:800}
.dia h3{font-size:.85rem;font-weight:600;color:var(--muted);margin:0 0 .2rem}
.sec h2{font-family:var(--display);font-weight:700;font-size:1.15rem;margin:0 0 .15rem}
.sec .sub{margin:0 0 .9rem;color:var(--muted);font-size:.88rem;max-width:68ch}
.legend{display:flex;flex-wrap:wrap;gap:.3rem 1.1rem;margin:0 0 .6rem;padding:0;list-style:none;font-size:.82rem;color:var(--muted)}
.legend i{display:inline-block;width:.7rem;height:.7rem;border-radius:2px;margin-right:.35rem;vertical-align:-1px}
.board{border-top:2px solid var(--ink)}
.row{display:grid;grid-template-columns:minmax(7rem,11rem) minmax(0,1fr) 8.5rem;gap:0 1rem;align-items:stretch;border-bottom:1px solid var(--line);min-height:3.4rem}
.row.hd{min-height:1.8rem;border-bottom:0;font-size:.8rem;color:var(--muted)}
.who{display:grid;align-content:center;min-width:0}
.who b{overflow-wrap:anywhere}
.who b{font-family:var(--display);font-weight:700;font-size:1.05rem;line-height:1.2}
.who span{font-size:.78rem;color:var(--muted)}
.plot{position:relative;display:flex;align-items:center}
.bar{display:flex;height:1.15rem;border-radius:3px;overflow:hidden;transform-origin:left;animation:grow .8s cubic-bezier(.2,.8,.2,1) backwards;animation-delay:calc(var(--i,0)*45ms);min-width:2px}
.bar span{display:flex;align-items:center;justify-content:center;font-size:.7rem;font-weight:600;color:var(--bg);min-width:0;overflow:hidden}
.bar span.s1{color:var(--bg)}.bar span.s2{color:var(--maq-ink)}.bar span.s3{color:var(--on3)}.bar span.s4{color:var(--on4)}
.s1{background:var(--s1)}.s2{background:var(--s2)}.s3{background:var(--s3)}.s4{background:var(--s4)}
.bar.solo{background:var(--folha)}.bar.over{background:var(--critico)}
.mk{position:absolute;top:0;bottom:0;width:2px;background:var(--ink);opacity:.85}
.mkl{position:absolute;bottom:0;transform:translateX(-50%);white-space:nowrap;font-weight:600;color:var(--ink)}
.res{display:grid;align-content:center;justify-items:end;text-align:right;line-height:1.2}
.res strong{font-family:var(--display);font-weight:800;font-size:1.45rem;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.res small{font-size:.76rem;color:var(--muted);font-variant-numeric:tabular-nums}
.res .b{display:inline-block;font-size:.74rem;font-weight:600;padding:.05rem .5rem;border-radius:999px;margin-top:.15rem}
.b.bom{background:var(--bom-bg);color:var(--bom)}.b.atencao{background:var(--atencao-bg);color:var(--atencao)}.b.critico{background:var(--critico-bg);color:var(--critico)}
.n-bom{color:var(--bom)}.n-atencao{color:var(--atencao)}.n-critico{color:var(--critico)}
.filtros{display:flex;flex-wrap:wrap;gap:.75rem 1.25rem;align-items:flex-end}
.filtros label{display:grid;gap:.25rem;font-size:.8rem;font-weight:600;color:var(--muted)}
.filtros select{font:inherit;font-size:.92rem;font-weight:500;color:var(--ink);background:var(--bg);border:1px solid var(--ink);border-radius:6px;padding:.45rem 2rem .45rem .7rem;min-width:min(100%,15rem);max-width:100%}
.limpar{font:inherit;font-size:.85rem;font-weight:600;color:var(--ink);background:none;border:0;border-bottom:2px solid var(--maq);padding:.2rem 0;cursor:pointer}
select:focus-visible{outline:3px solid var(--maq);outline-offset:2px}
.bar span.v1,.bar.v1{background:var(--v1)}.bar span.v2,.bar.v2{background:var(--v2)}.bar span.v3,.bar.v3{background:var(--v3)}
.row.subrow{min-height:2.5rem;border-bottom:1px dashed var(--line)}
.row.subrow .who{padding-left:1rem}.row.subrow .who b{font-size:.88rem;font-weight:600}.row.subrow .bar{height:.8rem}.row.subrow .res strong{font-size:1.05rem}
.rowbtn{font:inherit;color:inherit;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);width:100%;padding:0;cursor:pointer}
.rowbtn:hover{background:var(--soft)}.rowbtn:focus-visible{outline:3px solid var(--maq);outline-offset:-3px}
.chart{width:100%;height:auto;max-height:150px;display:block}
.col{fill:var(--folha);transform-box:fill-box;transform-origin:bottom;animation:up .7s cubic-bezier(.2,.8,.2,1) backwards}
.col.hi{fill:var(--critico)}
.tv{font-size:10px;font-weight:600;fill:var(--ink);font-family:var(--text)}.tl{font-size:10px;fill:var(--muted);font-family:var(--text)}
.meta{stroke:var(--ink);stroke-dasharray:4 3}.tm{font-size:9px;fill:var(--muted);font-family:var(--text)}
.scroll{overflow-x:auto}
.tb{width:100%;border-collapse:collapse;min-width:560px;font-variant-numeric:tabular-nums}
.tb th,.tb td{padding:.6rem .6rem .6rem 0;text-align:left;border-bottom:1px solid var(--line);font-size:.9rem}
.tb thead th{font-size:.8rem;color:var(--muted);font-weight:600;border-bottom:2px solid var(--ink)}
.tb thead button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0;font-weight:inherit}
.tb thead th[aria-sort=ascending] button::after{content:" ▲";font-size:.65em}.tb thead th[aria-sort=descending] button::after{content:" ▼";font-size:.65em}
.tb tbody th{font-family:var(--display);font-weight:700}.r{text-align:right!important;padding-right:0!important}
.rodape{margin:0;font-size:.8rem;color:var(--muted);max-width:75ch}
[hidden]{display:none!important}
@keyframes grow{from{transform:scaleX(0)}}@keyframes up{from{transform:scaleY(0)}}
@media (prefers-reduced-motion:reduce){.bar,.col{animation:none}}
@media (max-width:720px){.head{grid-template-columns:minmax(0,1fr)}}
@media (max-width:480px){.logo{height:68px}}
@media (max-width:560px){
  .row{grid-template-columns:1fr auto;gap:.25rem 1rem;padding-block:.6rem}
  .row .plot{grid-column:1/-1;order:3;min-height:1.6rem}
  .row.hd{display:none}
}
</style>
</head><body>
<header class="band"><div class="band-in gut">
  <img class="logo" src="logo-branco.png" alt="Bioenergética Aroeira" width="67" height="92">
  <div><h1>Acompanhamento de frotas</h1><p class="per" id="periodo"></p></div>
</div></header>
<div class="wrap gut">
  <p class="aviso" id="aviso" role="note">Dados de exemplo para definir o visual. Os números reais entram quando a fonte estiver definida.</p>
  <div class="nav">
    <div id="tabs" role="tablist" aria-label="Áreas do painel"></div>
    <div class="seg" id="filtro" role="group" aria-label="Filtrar por tipo de equipamento">
      <button type="button" data-f="Todos" aria-pressed="true">Todos</button>
      <button type="button" data-f="Trator" aria-pressed="false">Tratores</button>
      <button type="button" data-f="Caminhão" aria-pressed="false">Caminhões</button>
    </div>
  </div>
  <main id="painel" role="tabpanel" tabindex="0"></main>
</div>
<footer class="foot gut">Bioenergética Aroeira S/A, Tupaciguara/MG. <a href="https://www.bioaroeira.com.br" target="_blank" rel="noopener">www.bioaroeira.com.br</a></footer>
<script src="dados.js"></script>
<script src="app.js"></script>
</body></html>
