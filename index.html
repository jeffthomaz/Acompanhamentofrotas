select:focus-visible{outline:3px solid var(--maq);outline-offset:2px}
.bar span.v1,.bar.v1{background:var(--v1)}.bar span.v2,.bar.v2{background:var(--v2)}.bar span.v3,.bar.v3{background:var(--v3)}

@media (min-width:1000px){.kpis{grid-template-columns:repeat(7,minmax(0,1fr))}.kpis{gap:.55rem}.kpi{padding-inline:.5rem}.kpi .ic{width:1.45rem;height:1.45rem}.kh{gap:.35rem}.kl{font-size:.74rem;letter-spacing:-.01em}.kv{font-size:clamp(1.5rem,2.1vw,2rem)}}
.kl{min-width:0}

.kv{font-family:var(--display);font-weight:800;font-size:2.4rem;line-height:1.1;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.dl{font-size:.9rem;font-weight:700;font-variant-numeric:tabular-nums}.dl.bom{color:var(--bom)}.dl.ruim{color:var(--critico)}.dl.neutro{color:var(--muted)}
.ks{font-size:.72rem;color:var(--muted)}
.kp{display:grid;justify-items:center;gap:0;font-size:.76rem;color:var(--muted);margin:-.1rem 0 .1rem}.kp b{color:var(--ink);font-variant-numeric:tabular-nums}.kp i{font-style:normal;opacity:.6}
.c-total{--cc:var(--c-total)}.c-vel{--cc:var(--c-vel)}.c-celular{--cc:var(--c-celular)}.c-cinto{--cc:var(--c-cinto)}.c-distracao{--cc:var(--c-distracao)}.c-cigarro{--cc:var(--c-outros)}.c-faixa{--cc:var(--c-faixa)}.c-fadiga{--cc:var(--c-cigarro)}.c-camera{--cc:var(--c-faixa)}.c-outros{--cc:var(--c-outros)}
.g3{display:grid;gap:1rem}
.g-a{grid-template-columns:minmax(0,1.55fr) minmax(0,1.1fr) minmax(0,1fr)}

@media (max-width:980px){.g-a,.g-b{grid-template-columns:minmax(0,1fr)}}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:1rem 1.1rem 1.1rem;box-shadow:0 1px 3px rgba(10,42,25,.08);min-width:0}

rect.seg.c-total{fill:var(--folha)}

rect.seg.c-vel{fill:var(--c-vel)}rect.seg.c-celular{fill:var(--c-celular)}rect.seg.c-cinto{fill:var(--c-cinto)}rect.seg.c-distracao{fill:var(--c-distracao)}rect.seg.c-cigarro{fill:var(--c-outros)}rect.seg.c-faixa{fill:var(--c-faixa)}rect.seg.c-con{fill:var(--folha)}rect.seg.c-off{fill:var(--critico)}rect.seg.c-man{fill:var(--s3)}rect.seg.c-par{fill:var(--maq)}rect.seg.c-fadiga{fill:var(--c-cigarro)}rect.seg.c-camera{fill:var(--c-faixa)}rect.seg.c-outros{fill:var(--c-outros)}
.legend i{background:var(--cc)}
